[project]
name = "gatac-chromafold"
version = "0.1.0"
description = "ChromaFold contact-map prediction from GATAC fragments and AnnData"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.13"
dependencies = [
    "gatac>=0.1.0",  # public API only: io.FragmentFile, dr.iterative_lsi, pp genomes
    "numba>=0.60",
]

[project.optional-dependencies]
# running the model: predict()
model = [
    "torch>=2.4",
    "gdown>=5",  # ChromaFold's CTCF motif tracks are on Google Drive
]
# RAPIDS, through GATAC's extras: the one matching the CUDA version nvidia-smi reports
rapids-cu12 = ["gatac[rapids-cu12]"]
rapids-cu13 = ["gatac[rapids-cu13]"]

# gatac.chromafold imports gatac_chromafold
[project.entry-points."gatac.ext"]
chromafold = "gatac_chromafold"

# `gatac chromafold ...`
[project.entry-points."gatac.cli"]
chromafold = "gatac_chromafold.cli:register"

[dependency-groups]
test = [
    "pytest>=8",
    "scikit-learn",  # ChromaFold's own metacell code, the reference of the tests
]

[tool.uv]
conflicts = [
    [
        { extra = "rapids-cu12" },
        { extra = "rapids-cu13" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not reproducibility"]
markers = [
    "reproducibility: downloads the PBMC 5k fragments and compares with ChromaFold's code (minutes); run with -m reproducibility",
]
